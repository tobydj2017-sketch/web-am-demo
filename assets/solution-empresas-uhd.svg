    <text x="392" y="184" fill="#19221d" font-family="Inter, Arial, sans-serif" font-size="44" font-weight="900">nunca lo perdera</text>
    <text x="392" y="238" fill="#19221d" font-family="Inter, Arial, sans-serif" font-size="44" font-weight="900">de vista</text>
    <circle cx="342" cy="316" r="54" fill="#111817"/><circle cx="342" cy="316" r="24" fill="#dce6df"/>
    <circle cx="910" cy="316" r="54" fill="#111817"/><circle cx="910" cy="316" r="24" fill="#dce6df"/>
