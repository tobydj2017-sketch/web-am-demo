<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Empresas e instituciones - AM Seguridad</title>
  <desc id="desc">Ilustracion de camion y movil custodiado con seguimiento satelital y ruta monitoreada.</desc>
  <defs>
    <linearGradient id="sky" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#c9f7ff"/>
      <stop offset="0.44" stop-color="#89dcec"/>
      <stop offset="1" stop-color="#d8f4de"/>
    </linearGradient>
    <linearGradient id="road" x1="0" x2="1">
      <stop offset="0" stop-color="#0a1611"/>
      <stop offset="0.5" stop-color="#1c3026"/>
      <stop offset="1" stop-color="#0a1611"/>
    </linearGradient>
    <filter id="shadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="26" stdDeviation="18" flood-color="#07100b" flood-opacity="0.34"/>
    </filter>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="url(#sky)"/>
  <circle cx="126" cy="144" r="36" fill="#ffe900"/>
  <g opacity="0.38" fill="#ffffff">
