    <text x="112" y="132" fill="#142019" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="900">SEGURIDAD</text>
    <circle cx="112" cy="184" r="46" fill="#111817"/><circle cx="112" cy="184" r="20" fill="#dce6df"/>
    <circle cx="344" cy="184" r="46" fill="#111817"/><circle cx="344" cy="184" r="20" fill="#dce6df"/>
