  <path d="M146 424c160-80 302-82 430-12 102 56 218 66 348 10 160-68 326-46 486 58" fill="none" stroke="#39b54a" stroke-width="12" stroke-linecap="round" stroke-dasharray="24 28" opacity="0.7"/>
  <g filter="url(#shadow)" transform="translate(330 352)">
    <rect x="220" y="76" width="626" height="224" rx="22" fill="#f5fbf6" stroke="#253029" stroke-width="6"/>
