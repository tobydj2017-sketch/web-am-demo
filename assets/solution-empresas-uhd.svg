    <text x="0" y="72" fill="#158f32" font-family="Inter, Arial, sans-serif" font-size="34" font-weight="800">AM nunca lo perdera de vista</text>
    <text x="0" y="128" fill="#23342c" font-family="Inter, Arial, sans-serif" font-size="30" font-weight="600">Custodia, seguimiento satelital y respuesta operativa.</text>
